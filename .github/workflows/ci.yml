name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2

      - name: unit tests
        run: go test -race -cover ./...

  docker-smoke:
    name: docker build + containerized smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for /ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9999/ready; then exit 0; fi
            sleep 3
          done
          echo "stack never became ready" >&2
          exit 1

      - name: Official k6 smoke test
        run: |
          cd loadtest
          docker compose --profile smoke up --abort-on-container-exit --exit-code-from k6-smoke

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
